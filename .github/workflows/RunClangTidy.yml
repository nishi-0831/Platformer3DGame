name: Run clang-tidy

on: 
 push:
  branches: ['**']

permissions:
 contents: read
 security-events: write

concurrency:
 group: clang-tidy-${{ github.ref }}
 cancel-in-progress: true

jobs:
 clang-tidy:
  runs-on: windows-latest

  steps:

  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Env
    uses: ./.github/actions/setup-env

  # run-clang-tidy.pyが内部でPyYAMLを扱う
  - name: Install PyYAML
    shell: pwsh
    run: |
      pip install PyYAML

  # clang-tidyを実行
  - name: Run clang-tidy
    run: |
     cmake --build out/build/default --target clang-tidy

  - name: Upload SARIF to GitHub
    uses: github/codeql-action/upload-sarif@v3
    # エラーがあってもSARIFをアップロードする
    if: always() 
    with:
    # SARIFファイルのパス(相対パス)
     sarif_file: tidy-output.sarif
     category: clang-tidy

